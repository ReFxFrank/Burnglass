<!DOCTYPE html>
<!--
  Burnglass Strip popover UI (formerly Pulse Strip).
  Adapted from openusage-windows (https://github.com/rebers/openusage) tray/web/index.html,
  MIT License, Copyright (c) 2026 Robin Ebers. See strip/LICENSE-openusage.
  Restyled for Burnglass (dark-only, the "Glass" palette) to match the dashboard: spend by SOURCE
  in the dashboard's source colours, usage windows as "% used" on the dashboard's meter bar.
  OpenUsage name/logo removed per its trademark policy.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Burnglass</title>
<style>
/* ---- Burnglass design tokens (dark-only). Surfaces, ink, status, meters and the source series are
   the dashboard's Command Center dark set (web/src/styles.css); the accent is the "Glass" ice-cyan.
   Amber/red mean status only; source colours mean sources only; the ember orange lives in the logo
   mark, never here. ---- */
:root{
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;

  --tray:#0a0b0f;                 /* popover page (--bg); the host's Backdrop matches it */
  --card:#12141a;                 /* cards (--panel) */
  --card-line:#22252f;            /* card edge (--line) */
  --segbg:#171a22;                /* segmented control trough (--panel-2) */
  --hover:#1a1d26;
  --hair:rgba(255,255,255,.08);

  --text:#edeff5;
  --text2:#b4b8c6;
  --text3:#8d92a4;
  --text4:#5f6475;

  --accent:#4cd4f7;               /* Glass ice */
  --axis:#2e323e;                 /* chart axis line (--axis) */
  --m-track:#18252c;              /* meter track + donut ring (--m-track) */
  --m-fill:#4cd4f7;               /* meter fill below the lowest alert threshold (--m-fill) */
  --warn:#f2aa3c;                 /* meter at/above the lowest threshold */
  --crit:#f47171;                 /* meter at/above the highest threshold */
  --seg-on-bg:#1e212b;            /* --panel-3 */
  --seg-on-shadow:0 1px 2px rgba(0,0,0,.35);

  /* density */
  --pad-h:14px;                   /* row horizontal padding */
  --bar-row-pad:8px;              /* barRowPadding */
  --text-row-pad:5px;             /* textRowPadding */
  --section-gap:11px;             /* sectionSpacing */
  --header-gap:4px;               /* headerToCardSpacing */
  --card-gutter:4px;              /* cardGutter */
  --radius:10px;                  /* card radius = the dashboard's panels (--r-md); window radius 20px is host-side */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--tray);color:var(--text);font-family:var(--font);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-size:13px;line-height:1.25;
  user-select:none;-webkit-user-select:none;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none}
/* Hide the scrollbar entirely — the popover sizes to its content, so the bar only ever flickered in
   during resize. Scrolling by wheel/trackpad still works if content ever exceeds the max height. */
::-webkit-scrollbar{width:0;height:0;display:none}
#app{padding:12px var(--pad-h) 10px}

/* ---------- Total Spend card ---------- */
.spend{background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius);padding:12px 14px 14px;margin-bottom:var(--section-gap)}
.spend-head{display:flex;align-items:center;gap:5px;margin-bottom:12px}
.spend-title{font-size:15px;font-weight:600}
.info{width:14px;height:14px;border-radius:50%;color:var(--text3);flex:0 0 auto;display:flex}
.spend-head .spacer{flex:1}

/* segmented control — the dashboard's Seg (trough --panel-2, selected --panel-3), plus the strip's
   sliding + draggable thumb */
.seg{position:relative;display:flex;background:var(--segbg);border:1px solid var(--card-line);border-radius:6px;padding:2px;margin-bottom:14px;
  touch-action:none;user-select:none;-webkit-user-select:none}
.seg-thumb{position:absolute;top:2px;left:0;bottom:2px;width:33%;border-radius:4px;background:var(--seg-on-bg);
  box-shadow:var(--seg-on-shadow);z-index:0;will-change:transform;
  transition:transform .34s cubic-bezier(.34,1.28,.64,1), width .18s ease}
.seg-thumb.drag{transition:none}
.seg button{position:relative;z-index:1;flex:1;border:0;background:transparent;font-family:inherit;font-size:12px;
  font-weight:500;color:var(--text3);height:24px;border-radius:4px;cursor:default;transition:color .22s ease}
.seg button:hover{color:var(--text2)}
.seg button.on{color:var(--text)}
/* No focus ring — this is an app popover, not a form; the thumb already shows the selection. */
.seg button:focus, .seg button:focus-visible{outline:none}

/* donut + legend: spend by SOURCE, like the dashboard's mini view (MiniDonut) */
.donut-wrap{display:flex;align-items:center;gap:14px}
.donut{position:relative;width:116px;height:116px;flex:0 0 auto}
.donut svg{display:block;transform:rotate(-90deg)}
.donut svg circle{fill:none}
.donut svg .ring{stroke:var(--m-track)}
.donut-wrap.anim{animation:pop .32s ease}
.donut .center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
/* At most 6 rows (top 5 + "Other"), 16px each + 4px gaps = 116px: never taller than the donut, so
   switching tabs never changes the popover's height. */
.legend{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.legend .row{display:flex;align-items:center;gap:7px;height:16px;font-size:12px;min-width:0}
.legend .sw{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.legend .name{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.legend .amt{margin-left:auto;color:var(--text);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
.legend .none{font-size:12px;color:var(--text3)}

/* ---------- Provider section ---------- */
.section{margin-bottom:var(--section-gap)}
.section:last-child{margin-bottom:0}
.sec-head{display:flex;align-items:center;gap:5px;padding:2px 6px 2px 4px;margin-bottom:var(--header-gap)}
.mark{width:16px;height:16px;flex:0 0 auto;background:var(--text2)}
.sec-name{font-size:14px;font-weight:600}
.sec-plan{font-size:11px;color:var(--text2)}
.sec-head .spacer{flex:1}
.sec-warn{color:var(--warn);font-size:11px}
.mark-r{width:16px;height:16px;flex:0 0 auto;background:var(--text2);opacity:.9}
/* Letter-badge fallback when no icon file ships for a provider — never render blank. Neutral: a
   provider glyph is not a data series. */
.mark-fallback{border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--text4);color:var(--text);font-size:10px;font-weight:700;line-height:1;opacity:1}

.card{background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius);padding:var(--card-gutter) 0}

/* meter (bounded) row: title · the dashboard's MeterBar · "N% used" + reset */
.mrow{padding:var(--bar-row-pad) var(--pad-h)}
.mrow .lbl{display:flex;align-items:baseline;gap:6px}
.mrow .title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* = web/src/styles.css ".meter": fill = % used, projection hatch, threshold ticks, warn/crit tones */
.meter{position:relative;height:8px;border-radius:2px;background:var(--m-track);margin:7px 0 6px}
.meter .f{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--m-fill)}
.meter .p{position:absolute;top:0;bottom:0;border-radius:0 2px 2px 0;background:repeating-linear-gradient(135deg, var(--m-fill) 0 2px, transparent 2px 4px);opacity:.75}
.meter .t{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--card)}
.meter .t::after{content:"";position:absolute;left:0;right:0;top:3px;bottom:3px;background:var(--text4)}
.meter.warn .f{background:var(--warn)}
.meter.warn .p{background:repeating-linear-gradient(135deg, var(--warn) 0 2px, transparent 2px 4px)}
.meter.crit .f{background:var(--crit)}
.meter.crit .p{background:repeating-linear-gradient(135deg, var(--crit) 0 2px, transparent 2px 4px)}
.mrow .read{display:flex;align-items:baseline;gap:8px;font-size:12px;min-width:0}
.mrow .read .head{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mrow .read .proj{color:var(--text3);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mrow .read .ctx{margin-left:auto;color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums}
.mrow .read .warn{color:var(--warn)}
.mrow .read .crit{color:var(--crit)}

/* text (unbounded) row */
.trow{display:flex;align-items:center;gap:10px;padding:var(--text-row-pad) var(--pad-h)}
.trow.tight{padding-top:2px}
.trow .tl{font-size:12px;font-weight:600;color:var(--text)}
.trow .tv{margin-left:auto;font-size:12px;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.trow .tv .sub{display:block;font-size:11px;color:var(--text2)}

/* trend sparkline row — the dashboard's mini trend (MiniTrend): neutral days on an axis line, today
   (the last bar) in the accent, no bar at all for a day with no spend */
.chrow{padding:8px var(--pad-h)}
.chrow .tl{font-size:12px;font-weight:600;margin-bottom:6px;display:flex}
.chrow .tl .note{margin-left:auto;font-weight:400;color:var(--text2)}
.spark{display:flex;align-items:flex-end;gap:2px;height:19px;border-bottom:1px solid var(--axis)}
.spark .b{flex:1;min-width:2px;background:var(--text4);border-radius:1px 1px 0 0}
.spark .b.today{background:var(--accent)}

.empty{color:var(--text2);text-align:center;padding:26px 16px;font-size:13px}
.hidden{display:none}

/* Popover open: the panel grows OUT of its bottom-right corner (toward the strip) — a real scale-up
   "drag", not a fade-flash. CRITICAL: no `animation-fill-mode` — content is visible by default
   (opacity:1), so a skipped animation can never blank the popover. */
#app{transform-origin:100% 100%;opacity:1}
body.opening #app{animation:popopen .44s cubic-bezier(.16,1,.3,1)}
@keyframes popopen{
  0%{opacity:0;transform:scale(.55)}
  22%{opacity:1}
  100%{opacity:1;transform:scale(1)}
}

/* micro-animations (enhancement only, never hold an invisible state; nothing loops) */
@keyframes pop{from{opacity:.45;transform:scale(.97)}to{opacity:1;transform:none}}
.donut .center{transition:opacity .25s ease}

/* errored provider (e.g. token invalidated) */
.errsec .sec-name{color:var(--text)}
.errcard{background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius);padding:10px var(--pad-h);display:flex;gap:9px;align-items:flex-start}
.errcard .warn{color:var(--warn);flex:0 0 auto;margin-top:1px}
.errcard .msg{font-size:12px;color:var(--text2);line-height:1.35}
.errcard .msg b{color:var(--text);font-weight:600}

/* footer: brand + dashboard link */
.footer{display:flex;align-items:center;gap:6px;padding:8px var(--pad-h) 4px;margin-top:4px}
.footer .spacer{flex:1}
.brand{display:flex;align-items:center;gap:6px;min-width:0}
.brand img{width:16px;height:16px;flex:0 0 auto;display:block}
/* Wordmark: "Burn" in ink, "glass" in the accent (brand rule 4). */
.brand .wm{font-size:13px;font-weight:620;letter-spacing:-.018em;color:var(--text)}
.brand .wm em{font-style:normal;color:var(--accent)}
.footer .dash{border:0;background:transparent;color:var(--text2);font-family:inherit;font-size:12px;
  font-weight:600;padding:4px 8px;border-radius:6px;cursor:default}
.footer .dash:hover{background:var(--hover);color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ---------- theme ---------- */
// The popover is dark-only. The host may still call window.setTheme — keep it as a harmless no-op
// so host calls never throw. No light theme, no toggle, no persistence.
window.setTheme = function(){};

// Called by the host each time the popover is shown, to replay the spring-open.
window.playOpen = function(){
  const b=document.body;
  b.classList.remove("opening"); void b.offsetWidth; // restart the animation
  b.classList.add("opening");
  setTimeout(()=>b.classList.remove("opening"), 360);
};

/* ---------- helpers ---------- */
const ICONS = "icons/";
// Icon files that actually ship in icons/ — anything else gets the letter-badge fallback,
// so a missing icon file can never render as a blank glyph.
const ICON_FILES = new Set(["claude","codex","gemini"]);
const SVG_NS = "http://www.w3.org/2000/svg";
const el = (t,c)=>{const e=document.createElement(t); if(c)e.className=c; return e;};
const svgEl = (t,attrs)=>{const e=document.createElementNS(SVG_NS,t); for(const k in attrs) e.setAttribute(k,attrs[k]); return e;};
function mark(node, providerId){ // monochrome provider glyph via CSS mask, or letter-badge fallback
  if(ICON_FILES.has(providerId)){
    const url = `url("${ICONS}${providerId}.svg")`;
    node.style.webkitMaskImage = url; node.style.maskImage = url;
    node.style.webkitMaskSize = node.style.maskSize = "contain";
    node.style.webkitMaskRepeat = node.style.maskRepeat = "no-repeat";
    node.style.webkitMaskPosition = node.style.maskPosition = "center";
  } else {
    node.classList.add("mark-fallback");
    node.textContent = String(providerId||"?").charAt(0).toUpperCase();
  }
}

// The dashboard's categorical SOURCE series, dark values (web/src/styles.css --s1..--s6). The host
// sends each source's colour already assigned (by its position in the server's allSources, like the
// dashboard's makeColorMap); this table is for a payload saved by an older strip, and the check
// below rejects anything that is not a plain #rrggbb.
const SERIES = ["#3987e5","#d95926","#199e70","#c98500","#d55181","#008300"];
const OTHER_COLOR = "#8d92a4"; // --text3: the merged "Other" slice is not a source
const safeColor = (c,i)=> /^#[0-9a-f]{6}$/i.test(String(c||"")) ? c : SERIES[i%SERIES.length];

function money(n){ // compact center label: $13.4K, $2.5K, $91.15
  if(n>=1000){ const k=n/1000; return "$"+(k>=100?Math.round(k):k.toFixed(1)).toString().replace(/\.0$/,"")+"K"; }
  return "$"+n.toFixed(2);
}
// The dashboard's money(): "$2,178.09", "<$0.01".
function moneyFull(n){
  if(n>0 && n<0.01) return "<$0.01";
  return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function parseDollars(s){ if(!s)return 0; const m=String(s).replace(/,/g,"").match(/\$([\d.]+)/); return m?parseFloat(m[1]):0; }
const num = v => { const n=Number(v); return isFinite(n) && n>0 ? n : 0; };

// "Resets in 7m" · "Resets in 2h 05m" · "Resets in 40d 18h" (the dashboard's dur(), to the minute —
// the popover re-renders each time it opens rather than ticking).
function fmtReset(iso){
  if(!iso) return null;
  let ms = new Date(iso).getTime() - Date.now();
  if(isNaN(ms)) return null;
  if(ms<0) ms=0;
  const m = Math.floor(ms/60000), h=Math.floor(m/60), d=Math.floor(h/24);
  if(d>0) return `Resets in ${d}d ${h-d*24}h`;
  if(h>0) return `Resets in ${h}h ${String(m-h*60).padStart(2,"0")}m`;
  return `Resets in ${Math.max(1,m)}m`;
}

/* ---------- alert thresholds / meter tone (the dashboard's lib.js alertThresholds + meterTone) ---------- */
// The host passes the dashboard's alert thresholds as payload.thresholds; default 80 / 95.
let THRESHOLDS = [80,95];
function alertThresholds(t){
  const list = Array.isArray(t) ? t.filter(n=>typeof n==="number" && n>0 && n<=100) : [];
  return (list.length ? list : [80,95]).slice().sort((a,b)=>a-b);
}
// '' | 'warn' | 'crit' for a used-%: at/above the lowest threshold → warn, at/above the highest
// (when there are 2+) → crit. The taskbar strip tints its numbers by the same rule.
function meterTone(pct, th){
  if(pct==null || !isFinite(pct) || !th.length) return "";
  if(th.length>1 && pct>=th[th.length-1]) return "crit";
  return pct>=th[0] ? "warn" : "";
}

/* ---------- meter row ---------- */
function meterRow(line){
  const limit = Number(line.limit)>0 ? Number(line.limit) : 100;
  const pct = Math.max(0, Math.min(100, (Number(line.used)||0)/limit*100));
  const shown = Math.round(pct);                        // the number printed here AND on the taskbar
  const tone = meterTone(shown, THRESHOLDS);
  const pj = Number(line.projected);
  const proj = line.projected!=null && isFinite(pj) && pj>pct ? Math.min(100, pj) : null;

  const row=el("div","mrow");
  const lbl=el("div","lbl");
  const title=el("span","title"); title.textContent=line.label; lbl.appendChild(title);
  row.appendChild(lbl);

  // The dashboard's MeterBar: fill = % used, hatch up to the projection, a tick per threshold.
  const meter=el("div","meter"+(tone?" "+tone:""));
  meter.setAttribute("role","meter");
  meter.setAttribute("aria-valuemin","0"); meter.setAttribute("aria-valuemax","100");
  meter.setAttribute("aria-valuenow",String(shown));
  meter.setAttribute("aria-label",`${line.label}: ${shown}% used`);
  const f=el("i","f"); f.style.width=pct.toFixed(1)+"%"; meter.appendChild(f);
  if(proj!=null){ const p=el("i","p"); p.style.left=pct.toFixed(1)+"%"; p.style.width=(proj-pct).toFixed(1)+"%"; meter.appendChild(p); }
  for(const th of THRESHOLDS){ const t=el("i","t"); t.style.left=th+"%"; meter.appendChild(t); }
  row.appendChild(meter);

  const read=el("div","read");
  const head=el("span","head"+(tone?" "+tone:"")); head.textContent=`${shown}% used`; read.appendChild(head);
  if(proj!=null){
    const pt=meterTone(Math.round(proj), THRESHOLDS);
    const ps=el("span","proj"+(pt?" "+pt:"")); ps.textContent=`→ ${Math.round(proj)}% at reset`;
    ps.title="Straight-line projection of % used at the reset, from the recent trend";
    read.appendChild(ps);
  }
  const ctx=el("span","ctx"); const r=fmtReset(line.resetsAt); if(r)ctx.textContent=r; read.appendChild(ctx);
  row.appendChild(read);
  return row;
}

/* ---------- text row ---------- */
function textRow(line, tight){
  const row=el("div","trow"+(tight?" tight":""));
  const l=el("span","tl"); l.textContent=line.label; row.appendChild(l);
  const v=el("span","tv"); v.textContent=line.value||"—";
  if(line.subtitle){ const s=el("span","sub"); s.textContent=line.subtitle; v.appendChild(s); }
  row.appendChild(v);
  return row;
}

/* ---------- trend row ---------- */
function chartRow(line){
  const row=el("div","chrow");
  const tl=el("div","tl"); tl.textContent=line.label;
  if(line.note){ const n=el("span","note"); n.textContent=line.note; tl.appendChild(n); }
  row.appendChild(tl);
  const spark=el("div","spark");
  const pts=line.points||[]; const max=Math.max(0.0001,...pts.map(p=>num(p.value)));
  pts.forEach((p,i)=>{
    const v=num(p.value);
    const b=el("div","b"+(i===pts.length-1?" today":"")); // the transform's last daily bucket is today
    b.style.height = v>0 ? Math.max(2, v/max*18).toFixed(1)+"px" : "0";
    if(p.label) b.title=p.label+(p.valueLabel?" · "+p.valueLabel:"");
    spark.appendChild(b);
  });
  row.appendChild(spark);
  return row;
}

/* ---------- provider section ---------- */
function providerSection(p){
  const sec=el("div","section");
  const head=el("div","sec-head");
  const name=el("span","sec-name"); name.textContent=p.displayName||p.providerId; head.appendChild(name);
  if(p.plan){ const pl=el("span","sec-plan"); pl.textContent=p.plan; head.appendChild(pl); }
  if(p.__error){ const w=el("span","sec-warn"); w.textContent="⚠"; w.title=p.__error; head.appendChild(w); }
  head.appendChild(el("div","spacer"));
  const mr=el("div","mark-r"); mark(mr,p.providerId); head.appendChild(mr);
  sec.appendChild(head);

  const card=el("div","card");
  const lines=p.lines||[];
  let prevText=false;
  for(const line of lines){
    // Skip empty placeholder rows (e.g. the "Status —" line a rate-limited refresh emits) — the meters
    // themselves are carried over by the host, so an em-dash row is pure noise.
    if(line.type==="text" && (!line.value || /^[—-]\s*$/.test(String(line.value)))) continue;
    if(line.type==="progress"){ card.appendChild(meterRow(line)); prevText=false; }
    else if(line.type==="barChart"){ card.appendChild(chartRow(line)); prevText=false; }
    else { card.appendChild(textRow(line, prevText)); prevText=true; }
  }
  sec.appendChild(card);
  return sec;
}

/* ---------- total spend (by source) ---------- */
let spendPeriod = "All Time";
const ALL_PERIODS=["Today","7 Days","30 Days","All Time"];
const PERIOD_FIELD = { "Today":"today", "7 Days":"week7", "30 Days":"cost30", "All Time":"allTime" };
const PERIOD_LINE = { "today":"Today", "week7":"Last 7 Days", "cost30":"Last 30 Days", "allTime":"All Time" };
let PERIODS=ALL_PERIODS.slice(); // active tab set — "All Time" only when some source reports it
let SPEND=null;   // live refs for in-place period switching
let SOURCES=[];   // [{id,label,color,today,week7,cost30,allTime?}]

// One row per SOURCE. The host sends them (payload.sources: the server's allSources order, the
// dashboard's colours and labels). A payload saved by an older strip has none: it falls back to one
// row per provider section, read from its Today / Last 7 Days / Last 30 Days lines.
function spendSources(payload, providers){
  const list = payload && !Array.isArray(payload) && Array.isArray(payload.sources) ? payload.sources : null;
  if(list && list.length){
    return list.filter(s=>s && s.id!=null).map((s,i)=>({
      id:String(s.id), label:String(s.label!=null && s.label!=="" ? s.label : s.id), color:safeColor(s.color,i),
      today:num(s.today), week7:num(s.week7), cost30:num(s.cost30), allTime:num(s.allTime)
    }));
  }
  return providers.map((p,i)=>{
    const row={ id:String(p.providerId||i), label:String(p.displayName||p.providerId||"?"), color:SERIES[i%SERIES.length] };
    for(const f in PERIOD_LINE){
      const line=(p.lines||[]).find(l=>l.type==="text"&&l.label===PERIOD_LINE[f]);
      row[f]=parseDollars(line&&line.value);
    }
    return row;
  });
}

// The selected tab's non-zero rows, largest first (the dashboard's order). More than 6 → the top 5
// plus one neutral "Other" slice, so the legend stays within the donut's height.
const MAX_ROWS = 6;
function spendRows(period){
  const f = PERIOD_FIELD[period];
  let rows = SOURCES.map(s=>({ id:s.id, name:s.label, color:s.color, amt:s[f]||0 })).filter(r=>r.amt>0);
  rows.sort((a,b)=>b.amt-a.amt);
  if(rows.length>MAX_ROWS){
    const rest=rows.slice(MAX_ROWS-1);
    rows=rows.slice(0,MAX_ROWS-1);
    rows.push({ id:"__other", name:`Other (${rest.length})`, color:OTHER_COLOR,
      amt:rest.reduce((s,r)=>s+r.amt,0), title:rest.map(r=>r.name+" "+moneyFull(r.amt)).join("\n") });
  }
  return rows;
}

function hasSpend(){ return SOURCES.some(s=>s.today>0||s.week7>0||s.cost30>0||s.allTime>0); }
function availablePeriods(){ return SOURCES.some(s=>s.allTime>0) ? ALL_PERIODS.slice() : ALL_PERIODS.slice(0,3); }

function spendCard(){
  PERIODS=availablePeriods();
  if(!PERIODS.includes(spendPeriod)) spendPeriod=PERIODS[PERIODS.length-1];

  const card=el("div","spend");
  const head=el("div","spend-head");
  const t=el("span","spend-title"); t.textContent="Total Spend"; head.appendChild(t);
  const info=el("span","info"); info.title="Spend by source, from your local logs, in the dashboard's source colours";
  info.innerHTML='<svg viewBox="0 0 16 16" width="14" height="14"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 7v4M8 4.6v.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
  head.appendChild(info);
  head.appendChild(el("div","spacer"));
  card.appendChild(head);

  // sliding + draggable segmented control
  const seg=el("div","seg");
  const thumb=el("div","seg-thumb"); seg.appendChild(thumb);
  const buttons=PERIODS.map((per)=>{
    const b=el("button", per===spendPeriod?"on":""); b.textContent=per; seg.appendChild(b); return b;
  });
  card.appendChild(seg);

  const body=el("div"); card.appendChild(body);
  SPEND={seg,thumb,buttons,body};
  attachSegDrag();
  updateSpendBody(false);
  requestAnimationFrame(()=>positionThumb(PERIODS.indexOf(spendPeriod), false));
  // The first rAF can measure the segment before layout settles (fonts/scrollbar), which left the
  // thumb sized and positioned for the wrong width. Re-place it whenever the segment's width changes.
  if(window.ResizeObserver){
    new ResizeObserver(()=>positionThumb(PERIODS.indexOf(spendPeriod), false)).observe(seg);
  }
  return card;
}

function positionThumb(i, animate){
  if(!SPEND) return;
  const pad=2, inner=SPEND.seg.clientWidth-pad*2, w=inner/PERIODS.length;
  if(!animate) SPEND.thumb.classList.add("drag");
  SPEND.thumb.style.width=w+"px";
  SPEND.thumb.style.transform=`translateX(${pad+i*w}px)`;
  if(!animate) requestAnimationFrame(()=>SPEND.thumb.classList.remove("drag"));
}

function selectPeriod(i, animate){
  i=Math.max(0,Math.min(PERIODS.length-1,i));
  const changed = spendPeriod!==PERIODS[i];
  spendPeriod=PERIODS[i];
  SPEND.buttons.forEach((b,j)=>b.classList.toggle("on",j===i));
  positionThumb(i, animate);
  if(changed){ updateSpendBody(true); postHeight(); }
}

function attachSegDrag(){
  const {seg,thumb}=SPEND;
  let dragging=false;
  const geom=()=>{ const r=seg.getBoundingClientRect(); const pad=2, inner=r.width-pad*2, w=inner/PERIODS.length; return {r,pad,inner,w}; };
  const place=(clientX)=>{ const {r,pad,inner,w}=geom(); let x=clientX-r.left-pad-w/2; x=Math.max(0,Math.min(inner-w,x));
    thumb.style.width=w+"px"; thumb.style.transform=`translateX(${pad+x}px)`;
    const i=Math.round(x/w); SPEND.buttons.forEach((b,j)=>b.classList.toggle("on",j===i)); return i; };
  seg.addEventListener("pointerdown",e=>{ dragging=true; thumb.classList.add("drag");
    try{seg.setPointerCapture(e.pointerId);}catch(_){}; place(e.clientX); e.preventDefault(); });
  seg.addEventListener("pointermove",e=>{ if(dragging) place(e.clientX); });
  const end=e=>{ if(!dragging)return; dragging=false; thumb.classList.remove("drag"); const i=place(e.clientX); selectPeriod(i,true); };
  seg.addEventListener("pointerup",end);
  seg.addEventListener("pointercancel",end);
}

function updateSpendBody(animate){
  const {body}=SPEND;
  const rows=spendRows(spendPeriod);
  const total=rows.reduce((s,r)=>s+r.amt,0);
  body.textContent="";
  const wrap=el("div","donut-wrap"+(animate?" anim":""));
  const donut=el("div","donut");
  // The dashboard's MiniDonut geometry (web/src/mini.jsx): one ring of stroke segments on the meter
  // track, a fixed 1.5-unit hairline gap between segments, 0.5 minimum so a tiny source stays
  // visible. Built with DOM calls, never markup strings.
  const S=116, R=52, C=2*Math.PI*R, sw=13, c=S/2;
  const svg=svgEl("svg",{viewBox:`0 0 ${S} ${S}`, width:S, height:S, role:"img",
    "aria-label":`Spend by source: ${moneyFull(total)}`});
  svg.appendChild(svgEl("circle",{class:"ring", cx:c, cy:c, r:R, "stroke-width":sw}));
  let off=0; const gap = rows.length>1 ? 1.5 : 0;
  if(total>0) for(const r of rows){
    const frac=r.amt/total;
    const seg=svgEl("circle",{cx:c, cy:c, r:R, "stroke-width":sw, "stroke-linecap":"butt",
      "stroke-dasharray":`${Math.max(0.5, frac*C-gap)} ${C}`, "stroke-dashoffset":String(-off)});
    seg.style.stroke=r.color;
    svg.appendChild(seg);
    off+=frac*C;
  }
  donut.appendChild(svg);
  const center=el("div","center"); center.textContent=money(total); donut.appendChild(center);
  wrap.appendChild(donut);

  const legend=el("div","legend");
  for(const r of rows){
    const row=el("div","row"); row.title=r.title || (r.name+" "+moneyFull(r.amt));
    const sw_=el("i","sw"); sw_.style.background=r.color; row.appendChild(sw_);
    const nm=el("span","name"); nm.textContent=r.name; row.appendChild(nm);
    const am=el("span","amt"); am.textContent=moneyFull(r.amt); row.appendChild(am);
    legend.appendChild(row);
  }
  if(rows.length===0){ const e=el("div","none"); e.textContent="No spend in this period"; legend.appendChild(e); }
  wrap.appendChild(legend);
  body.appendChild(wrap);
}

// The host sizes the window to the content after each render. The legend never outgrows the donut,
// so a tab switch should not change the height — but if it ever does, report it the same way.
let RENDERED_HEIGHT=0;
function postHeight(){
  try{
    const h=Math.min(document.body.scrollHeight, 2000);
    if(h===RENDERED_HEIGHT) return;
    RENDERED_HEIGHT=h;
    window.chrome.webview.postMessage({height:h});
  }catch(_){}
}

/* ---------- render ---------- */
function escapeHtml(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

let LAST_PROVIDERS = [];
let LAST_ERRORS=[];
function rerender(){ renderApp(LAST_PROVIDERS, LAST_ERRORS); }

// Errored providers worth surfacing: credentials exist but broke (re-auth needed) — not the ones the
// user never set up ("not logged in", "no API key"). Keeps the popover clean.
function actionableErrors(errors, providerIds){
  return (errors||[]).filter(e => e && e.providerId && !providerIds.has(e.providerId)
    && /revoked|expired|invalidat|conflict|re-?auth|session/i.test(e.message||""));
}

function errorSection(e){
  const sec=el("div","section errsec");
  const head=el("div","sec-head");
  const name=el("span","sec-name"); name.textContent=e.displayName||e.providerId; head.appendChild(name);
  head.appendChild(el("div","spacer"));
  const mr=el("div","mark-r"); mark(mr,e.providerId); head.appendChild(mr);
  sec.appendChild(head);
  const card=el("div","errcard");
  const w=el("span","warn"); w.innerHTML='<svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor"><path d="M8 2l6 10.5H2L8 2zm0 3.4a.8.8 0 00-.8.8v2.6a.8.8 0 001.6 0V6.2a.8.8 0 00-.8-.8zm0 6.1a.9.9 0 100-1.8.9.9 0 000 1.8z"/></svg>';
  card.appendChild(w);
  const msg=el("span","msg"); msg.innerHTML=escapeHtml(e.message||"Needs attention");
  card.appendChild(msg);
  sec.appendChild(card);
  return sec;
}

function renderApp(providers, errors){
  LAST_PROVIDERS = providers||[];
  LAST_ERRORS = errors||[];
  const app=document.getElementById("app");
  app.innerHTML="";
  SPEND=null;
  const ids=new Set((providers||[]).map(p=>p.providerId));
  const errs=actionableErrors(errors, ids);
  if((!providers || providers.length===0) && errs.length===0){
    const e=el("div","empty"); e.textContent="No usage yet — Burnglass is watching your local logs."; app.appendChild(e);
  } else {
    if(hasSpend()) app.appendChild(spendCard());
    for(const p of providers) app.appendChild(providerSection(p));
    for(const e of errs) app.appendChild(errorSection(e));
    app.appendChild(footer());
  }
  RENDERED_HEIGHT=Math.min(document.body.scrollHeight, 2000); // the host reports this one itself
}

function footer(){
  const f=el("div","footer");
  f.appendChild(brandMark());
  f.appendChild(el("div","spacer"));
  const d=el("button","dash"); d.textContent="Open dashboard →"; d.title="Open the Burnglass dashboard";
  d.onclick=()=>{ try{ window.chrome.webview.postMessage({open:"dashboard"}); }catch(e){} };
  f.appendChild(d);
  return f;
}

// The logo: the per-size pixel-snapped mark files (never one file scaled by a non-integer factor —
// the WebView picks by device pixel ratio) + the wordmark.
function brandMark(){
  const b=el("span","brand");
  const img=el("img");
  img.src="icons/burnglass-16.svg";
  img.srcset="icons/burnglass-16.svg 1x, icons/burnglass-20.svg 1.25x, icons/burnglass-24.svg 1.5x, icons/burnglass-32.svg 2x";
  img.width=16; img.height=16; img.alt="";
  b.appendChild(img);
  const wm=el("span","wm"); wm.textContent="Burn";
  const g=el("em"); g.textContent="glass"; wm.appendChild(g);
  b.appendChild(wm);
  return b;
}

// Entry point the host calls: renderData(<array or {providers, errors, sources, thresholds}>)
window.renderData = function(payload){
  try{
    let providers = Array.isArray(payload) ? payload : (payload && payload.providers) || [];
    const errors = (payload && payload.errors) || [];
    const byId={}; for(const e of errors){ if(e && e.providerId) byId[e.providerId]=e.message; }
    for(const p of providers){ if(byId[p.providerId]) p.__error=byId[p.providerId]; }
    THRESHOLDS = alertThresholds(payload && !Array.isArray(payload) ? payload.thresholds : null);
    SOURCES = spendSources(payload, providers);
    renderApp(providers, errors);
  }catch(err){ const a=document.getElementById("app"); a.textContent=""; const e=el("div","empty"); e.textContent=String(err); a.appendChild(e); }
};
